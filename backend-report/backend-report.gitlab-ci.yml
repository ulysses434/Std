include:
  - remote: 'https://gitlab.com/gitlab-org/gitlab/-/raw/2851f4d5/lib/gitlab/ci/templates/Jobs/SAST.latest.gitlab-ci.yml'

stages:
  - test
  - build
  - release
  - deploy

variables:
  VERSION: 1.0.${CI_PIPELINE_ID}

test:
  stage: test
  image: python:3.11-alpine
  before_script:
    - cd ${CI_PROJECT_DIR}/backend-report
    - pip install -r requirements.txt
  script:
    - python -m unittest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.9.0-debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64)\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
        --context "${CI_PROJECT_DIR}/backend-report"
        --dockerfile "${CI_PROJECT_DIR}/backend-report/Dockerfile"
        --destination "${CI_REGISTRY_IMAGE}/sausage-store/backend-report:${CI_COMMIT_SHA}"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

release:
  stage: release
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: [""]
  before_script:
    - crane auth login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
  script:
    - crane tag ${CI_REGISTRY_IMAGE}/sausage-store/backend-report:${CI_COMMIT_SHA} ${VERSION}
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

deploy-backend-report:
  stage: deploy
  image: docker:24.0.5
  before_script:
    - apk add --no-cache openssh-client bash vault
    - eval $(ssh-agent -s)
    - echo "${SSH_PRIVATE_KEY}" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "${SSH_KNOWN_HOSTS}" >> ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
    - docker context create remote --docker "host=ssh://${DEV_USER}@${DEV_HOST}"
    - docker context use remote
    - echo "${CI_REGISTRY_PASSWORD}" | docker login -u "${CI_REGISTRY_USER}" --password-stdin ${CI_REGISTRY}
  script:
  - export VAULT_TOKEN="$(vault write -field=token auth/jwt/login role=sausage-store jwt=$CI_JOB_JWT)"
  - export REPORTS_MONGODB_URI="$(vault kv get -field=spring.data.mongodb.uri secret/sausage-store)"
  - export VERSION=${VERSION}
  - export CI_REGISTRY_IMAGE=${CI_REGISTRY_IMAGE}
  - docker rm -f sausage-store-backend-report 2>/dev/null || true
  - docker compose up -d --force-recreate backend-report
  rules:
    - if: $CI_COMMIT_BRANCH == "main"