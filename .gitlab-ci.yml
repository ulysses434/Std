stages:
  - build
  - test
  - notify

include:
  - template: Security/SAST.gitlab-ci.yml

variables:
  SONARQUBE_URL: "https://sonarqube.praktikum-services.ru"

build-backend-code-job:
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH
      when: always
  script:
    - echo "Starting backend build..."
    - cd backend
    - mvn package
  artifacts:
    name: "backend-$CI_COMMIT_REF_NAME"
    paths:
      - backend/target/sausage-store-0.0.1-SNAPSHOT.jar
    expire_in: 1 week

sonarqube-backend-sast:
  stage: test
  image: maven:3.8-openjdk-16
  rules:
    - if: $CI_COMMIT_BRANCH
  needs: ["build-backend-code-job"]
  script: |
    cd backend && mvn verify sonar:sonar \
      -Dsonar.qualitygate.wait=true \
      -Dsonar.projectKey=$SONAR_PROJECT_KEY_BACK \
      -Dsonar.host.url=$SONARQUBE_URL \
      -Dsonar.login=$SONAR_LOGIN_BACK \


telegram-notification-backend:
  stage: notify
  rules:
    - if: $CI_COMMIT_BRANCH
      when: on_success
  needs: ["build-backend-code-job"]
  script:
    - |
      ARTIFACT_URL="${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/download"
      curl -X POST \
        -H 'Content-Type: application/json' \
        -d "{\"chat_id\": \"-003263328596\", \"text\": \"Backend собран. Job: ${CI_JOB_NAME}. Branch: ${CI_COMMIT_REF_NAME}. Artifacts: ${ARTIFACT_URL}\"}" \
        "https://api.telegram.org/bot5933756043:AAG6cdxMAdOtN3-NQ9sfS4CdpGuS8ilASwA/sendMessage"

build-frontend-code-job:
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH
      when: always
  script:
    - echo "Starting frontend build..."
    - cd frontend
    - npm install
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 week

sonarqube-frontend-sast:
  stage: test
  image: sonarsource/sonar-scanner-cli:latest
  needs: ["build-frontend-code-job"]
  rules:
    - if: $CI_COMMIT_BRANCH
  script:
    - cd frontend
    - sonar-scanner -Dsonar.projectKey=FrontFinish -Dsonar.sources=. -Dsonar.host.url=$SONARQUBE_URL -Dsonar.login=e34cd4d9cf689bb26d4b4c6bb4d903dbc6b4ca72
telegram-notification-frontend:
  stage: notify
  rules:
    - if: $CI_COMMIT_BRANCH
      when: on_success
  needs: ["build-frontend-code-job"]
  script:
    - |
      ARTIFACT_URL="${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/download"
      curl -X POST \
        -H 'Content-Type: application/json' \
        -d "{\"chat_id\": \"1003263328596\", \"text\": \"Frontend собран. Job: ${CI_JOB_NAME}. Branch: ${CI_COMMIT_REF_NAME}. Artifacts: ${ARTIFACT_URL}\"}" \
        "https://api.telegram.org/bot5933756043:AAG6cdxMAdOtN3-NQ9sfS4CdpGuS8ilASwA/sendMessage"