stages:
  - build
  - test
  - notify

include:
  - template: Security/SAST.gitlab-ci.yml

variables:
  SONAR_TOKEN_BACKEND: "058c12809bebb41825d79d611032f76a969c0117"
  SONAR_TOKEN_FRONTEND: "6ec52280dd469aadce23176a916261228b65d986"
  TELEGRAM_BOT_TOKEN: "5933756043:AAG6cdxMAdOtN3-NQ9sfS4CdpGuS8ilASwA"
  TELEGRAM_CHAT_ID: "-1003263328596"
  SONAR_PROJECT_KEY: "SPzqsgNcQkdX8oNod9x72"

build-code-job:
  stage: build
  only:
    changes:
      - backend/**/*
      - frontend/**/*
  before_script:
    - echo "Starting build job for commit: $CI_COMMIT_SHORT_SHA"
    - echo "Working directory: $PWD"
    - ls -la
  script:
    - echo "Building backend..."
    - cd backend && pwd
    - mvn --version || echo "Maven not found"
    - mvn clean package -Dmaven.repo.local=${CI_PROJECT_DIR}/.m2/repository -DskipTests || { echo "Backend build failed"; exit 1; }
    - echo "Backend build completed"
    
    - echo "Building frontend..."
    - cd ../frontend && pwd
    - node --version || echo "Node not found"
    - npm --version || echo "npm not found"
    - npm install || { echo "npm install failed"; exit 1; }
    - npm run build || { echo "npm build failed"; exit 1; }
    - echo "Frontend build completed"
    
    - echo "Preparing artifacts..."
    - cd ..
    - mkdir -p sausage-store-0.0.1
    - cp backend/target/sausage-store-0.0.1-SNAPSHOT.jar sausage-store-0.0.1/sausage-store-0.0.1.jar
    - cp -r frontend/dist/frontend sausage-store-0.0.1/public_html
    - ls -la sausage-store-0.0.1/
  artifacts:
    paths:
      - sausage-store-0.0.1/
  cache:
    paths:
      - .m2/repository
      - frontend/node_modules

build-backend-code-job:
  stage: build
  only:
    changes:
      - backend/**/*
  before_script:
    - echo "Building backend only..."
    - echo "Maven repo path: ${CI_PROJECT_DIR}/.m2/repository"
  script:
    - cd backend
    - mvn clean compile package -Dmaven.repo.local=${CI_PROJECT_DIR}/.m2/repository
    - ls -la target/
  artifacts:
    paths:
      - backend/target/sausage-store-0.0.1-SNAPSHOT.jar
  cache:
    paths:
      - .m2/repository

semgrep-sast:
  stage: test
  variables:
    COMPILE: "false"
    SAST_JAVA_VERSION: 11
    MAVEN_REPO_PATH: ${CI_PROJECT_DIR}/.m2/repository
  only:
    changes:
      - backend/**/*
      - frontend/**/*
  cache:
    paths:
      - ${CI_PROJECT_DIR}/.m2/repository

sonarqube-backend-sast:
  stage: test
  needs: ["build-backend-code-job"]
  only:
    changes:
      - backend/**/*
    refs:
      - main
  image: maven:3.8-openjdk-16
  before_script:
    - echo "Running SonarQube analysis for backend..."
    - cd backend && pwd
  script:
    - mvn sonar:sonar \
        -Dmaven.repo.local=${CI_PROJECT_DIR}/.m2/repository \
        -Dsonar.projectKey=$SONAR_PROJECT_KEY \
        -Dsonar.projectName="Backend Service" \
        -Dsonar.host.url=https://sonarqube.praktikum-services.ru \
        -Dsonar.login=$SONAR_TOKEN_BACKEND \
        -Dsonar.qualitygate.wait=true
  cache:
    paths:
      - ${CI_PROJECT_DIR}/.m2/repository

telegram-notification-backend:
  stage: notify
  only:
    changes:
      - backend/**/*
  script:
    - |
      curl -s -X POST \
        -H 'Content-Type: application/json' \
        -d "{\"chat_id\": \"$TELEGRAM_CHAT_ID\", \"text\": \" Backend собран успешно\n\n Коммит: $CI_COMMIT_SHORT_SHA\n Ветка: $CI_COMMIT_REF_NAME\n Job: $CI_JOB_NAME\"}" \
        https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage || echo "Telegram notification failed (non-critical)"
  needs: ["build-backend-code-job"]

build-frontend-code-job:
  stage: build
  only:
    changes:
      - frontend/**/*
  before_script:
    - echo "Building frontend only..."
  script:
    - cd frontend
    - npm install
    - npm run build
    - ls -la dist/
  artifacts:
    paths:
      - frontend/dist/frontend/
  cache:
    paths:
      - frontend/node_modules/

sonarqube-frontend-sast:
  stage: test
  image: sonarsource/sonar-scanner-cli:latest
  needs: ["build-frontend-code-job"]
  only:
    refs:
      - main
    changes:
      - frontend/**/*
  before_script:
    - echo "Running SonarQube analysis for frontend..."
    - cd frontend && pwd
  script:
    - sonar-scanner \
      -Dsonar.projectKey=$SONAR_PROJECT_KEY \
      -Dsonar.host.url=https://sonarqube.praktikum-services.ru \
      -Dsonar.login=$SONAR_TOKEN_FRONTEND \
      -Dsonar.sources=. \
      -Dsonar.language=js

telegram-notification-frontend:
  stage: notify
  only:
    changes:
      - frontend/**/*
  script:
    - |
      curl -s -X POST \
        -H 'Content-Type: application/json' \
        -d "{\"chat_id\": \"$TELEGRAM_CHAT_ID\", \"text\": \" Frontend собран успешно\n\n Коммит: $CI_COMMIT_SHORT_SHA\n Ветка: $CI_COMMIT_REF_NAME\n Job: $CI_JOB_NAME\"}" \
        https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage || echo "Telegram notification failed (non-critical)"
  needs: ["build-frontend-code-job"]