stages:
  - build
  - test
  - notify

include:
  - template: Security/SAST.gitlab-ci.yml

# Убрал этот job, так как он дублирует build-backend-code-job
# build-code-job:
#   stage: build
#   only:
#     changes:
#       - backend//*
#       - frontend//*
#   script:
#     - cd backend
#     - mvn package

build-backend-code-job:
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH
      changes:
        - backend/**/*
  script:
    - cd backend
    - mvn package
  artifacts:
    name: "backend-$CI_COMMIT_REF_NAME"
    paths:
      - backend/target/sausage-store-0.0.1-SNAPSHOT.jar
    expire_in: 1 week

build-frontend-code-job:
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH
      changes:
        - frontend/**/*
  script:
    - cd frontend
    - npm install
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 week

sonarqube-backend-sast:
  stage: test
  image: maven:3.8-openjdk-16
  rules:
    - if: $CI_COMMIT_BRANCH
      changes:
        - backend/**/*
  needs: ["build-backend-code-job"]
  script: |
    cd backend && mvn verify sonar:sonar \
      -Dsonar.qualitygate.wait=true \
      -Dsonar.projectKey=$SONAR_PROJECT_KEY_BACK \
      -Dsonar.host.url=$SONARQUBE_URL \
      -Dsonar.login=$SONAR_LOGIN_BACKEND \
      -Dsonar.projectName=$SONAR_PROJECT_NAME_BACKEND

semgrep-sast:
  stage: test
  variables:
    COMPILE: "false"
    SAST_JAVA_VERSION: 11
    MAVEN_REPO_PATH: ${CI_PROJECT_DIR}/.m2/repository
  rules:
    - if: $CI_COMMIT_BRANCH
  cache:
    paths:
      - ${CI_PROJECT_DIR}/.m2/repository

telegram-notification-backend:
  stage: notify
  rules:
    - if: $CI_COMMIT_BRANCH
      changes:
        - backend/**/*
  needs: ["build-backend-code-job"]
  script:
    - |
      curl -X POST \
        -H 'Content-Type: application/json' \
        -d "{\"chat_id\": \"-1003263328596\", \"text\": \"Backend собран. Артефакты: https://gitlab.praktikum-services.ru/std-ext-028-45/Sausagestore.git/-/jobs/artifacts/$CI_COMMIT_REF_NAME/download?job=build-backend-code-job\"}" \
        https://api.telegram.org/bot5933756043:AAG6cdxMAdOtN3-NQ9sfS4CdpGuS8ilASwA/sendMessage

telegram-notification-frontend:
  stage: notify
  rules:
    - if: $CI_COMMIT_BRANCH
      changes:
        - frontend/**/*
  needs: ["build-frontend-code-job"]
  script:
    - |
      curl -X POST \
        -H 'Content-Type: application/json' \
        -d "{\"chat_id\": \"-1003263328596\", \"text\": \"Frontend собран. Артефакты: https://gitlab.praktikum-services.ru/std-ext-028-45/Sausagestore.git/-/jobs/artifacts/$CI_COMMIT_REF_NAME/download?job=build-frontend-code-job\"}" \
        https://api.telegram.org/bot5933756043:AAG6cdxMAdOtN3-NQ9sfS4CdpGuS8ilASwA/sendMessage