stages:
  - module-pipelines

frontend:
  stage: module-pipelines
  trigger:
    include: "frontend/frontend.gitlab-ci.yml"
    strategy: depend
  only:
    changes:
      - frontend/**/*

backend:
  stage: module-pipelines
  trigger:
    include: "backend/backend.gitlab-ci.yml"
    strategy: depend
  only:
    changes:
      - backend/**/*