stages:
  - build
  - test
  - notify

include:
  - template: Security/SAST.gitlab-ci.yml

variables:
  SONAR_TOKEN_BACKEND: "058c12809bebb41825d79d611032f76a969c0117"
  SONAR_TOKEN_FRONTEND: "6ec52280dd469aadce23176a916261228b65d986"
  TELEGRAM_BOT_TOKEN: "5933756043:AAG6cdxMAdOtN3-NQ9sfS4CdpGuS8ilASwA"
  TELEGRAM_CHAT_ID: "-1003263328596"
  SONAR_PROJECT_KEY: "SPzqsgNcQkdX8oNod9x72"

build-code-job:
  stage: build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - backend/**/*
        - frontend/**/*
  script:
    - cd backend
    - mvn package -Dmaven.repo.local=${CI_PROJECT_DIR}/.m2/repository
    - cd ../frontend
    - npm install
    - npm run build
    - cd ..
    - mkdir -p sausage-store-0.0.1
    - cp backend/target/sausage-store-0.0.1-SNAPSHOT.jar sausage-store-0.0.1/sausage-store-0.0.1.jar
    - cp -r frontend/dist/frontend sausage-store-0.0.1/public_html
  artifacts:
    paths:
      - sausage-store-0.0.1/

build-backend-code-job:
  stage: build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - backend/**/*
  script:
    - cd backend
    - mvn package -Dmaven.repo.local=${CI_PROJECT_DIR}/.m2/repository
  artifacts:
    paths:
      - backend/target/sausage-store-0.0.1-SNAPSHOT.jar
  cache:
    paths:
      - ${CI_PROJECT_DIR}/.m2/repository

sonarqube-backend-sast:
  stage: test
  needs: ["build-backend-code-job"]
  rules:
    - if: '$CI_COMMIT_REF_NAME == "main" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - backend/**/*
      exists:
        - backend/**/*
  image: maven:3.8-openjdk-16
  script:
    - cd backend
    - |
      mvn sonar:sonar \
        -Dmaven.repo.local=${CI_PROJECT_DIR}/.m2/repository \
        -Dsonar.projectKey=SPzqsgNcQkdX8oNod9x72 \
        -Dsonar.projectName="Backend Service" \
        -Dsonar.host.url=https://sonarqube.praktikum-services.ru \
        -Dsonar.login=058c12809bebb41825d79d611032f76a969c0117 \
        -Dsonar.qualitygate.wait=true
  cache:
    paths:
      - ${CI_PROJECT_DIR}/.m2/repository
    policy: pull

telegram-notification-backend:
  stage: notify
  needs: ["build-backend-code-job"]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - backend/**/*
      when: on_success
  script:
    - |
      curl -X POST \
        -H 'Content-Type: application/json' \
        -d "{\"chat_id\": \"$TELEGRAM_CHAT_ID\", \"text\": \"Александров Александр Backend собран успешно\n\nАртефакты доступны по ссылке:\n$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/download\n\n🔗 Коммит: $CI_COMMIT_SHORT_SHA\n🌿 Ветка: $CI_COMMIT_REF_NAME\"}" \
        https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage

build-frontend-code-job:
  stage: build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - frontend/**/*
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npm run build
  artifacts:
    paths:
      - frontend/dist/frontend/
  cache:
    key: frontend-$CI_COMMIT_REF_SLUG
    paths:
      - frontend/.npm/
      - frontend/node_modules/

sonarqube-frontend-sast:
  stage: test
  needs: ["build-frontend-code-job"]
  rules:
    - if: '$CI_COMMIT_REF_NAME == "main" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - frontend/**/*
      exists:
        - frontend/**/*
  image: sonarsource/sonar-scanner-cli:latest
  script:
    - cd frontend
    - sonar-scanner \
      -Dsonar.projectKey=SPzqsgNcQkdX8oNod9x72 \
      -Dsonar.host.url=https://sonarqube.praktikum-services.ru \
      -Dsonar.login=6ec52280dd469aadce23176a916261228b65d986 \
      -Dsonar.sources=. \
      -Dsonar.language=js

telegram-notification-frontend:
  stage: notify
  needs: ["build-frontend-code-job"]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - frontend/**/*
      when: on_success
  script:
    - |
      curl -X POST \
        -H 'Content-Type: application/json' \
        -d "{\"chat_id\": \"$TELEGRAM_CHAT_ID\", \"text\": \"Александров Александр Frontend собран успешно\n\nАртефакты доступны по ссылке:\n$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/download\n\n Коммит: $CI_COMMIT_SHORT_SHA\n Ветка: $CI_COMMIT_REF_NAME\"}" \
        https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage

cache:
  key: maven-$CI_COMMIT_REF_SLUG
  paths:
    - ${CI_PROJECT_DIR}/.m2/repository
  policy: pull-push