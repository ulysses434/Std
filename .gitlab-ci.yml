stages:
  - module-pipelines

frontend:
  stage: module-pipelines
  trigger:
    include:
      - "frontend/.gitlab-ci-frontend.yml"
    strategy: depend
  only:
    changes:
      - frontend/**/*


backend:
  stage: module-pipelines
  trigger:
    include:
      - "backend/.gitlab-ci-backend.yml"
    strategy: depend
  only:
    changes:
      - backend/**/*

