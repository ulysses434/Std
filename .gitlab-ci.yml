stages:
  - build
  - test
  - notify

include:
  - template: Security/SAST.gitlab-ci.yml

build-code-job:
  stage: build
  rules:
    changes:
      - backend/**/*
      - frontend/**/*
  script:
    - cd backend
    - mvn package -Dmaven.repo.local=${CI_PROJECT_DIR}/.m2/repository
    - cd ../frontend
    - npm install
    - npm run build
    - cd ..
    - mkdir -p sausage-store-0.0.1
    - cp backend/target/sausage-store-0.0.1-SNAPSHOT.jar sausage-store-0.0.1/sausage-store-0.0.1.jar
    - cp -r frontend/dist/frontend sausage-store-0.0.1/public_html
  artifacts:
    paths:
      - sausage-store-0.0.1/

build-backend-code-job:
  stage: build
  rules:
    changes:
      - backend/**/*
  script:
    - cd backend
    - mvn package -Dmaven.repo.local=${CI_PROJECT_DIR}/.m2/repository
  artifacts:
    paths:
      - backend/target/sausage-store-0.0.1-SNAPSHOT.jar
  cache:
    paths:
      - ${CI_PROJECT_DIR}/.m2/repository

sonarqube-backend-sast:
  stage: test
  needs:
    - build-backend-code-job
  rules:
    changes:
      - backend/**/*
    refs:
      - main
  image: maven:3.8-openjdk-16
  script:
    - cd backend
    - |
      mvn sonar:sonar \
        -Dmaven.repo.local=${CI_PROJECT_DIR}/.m2/repository \
        -Dsonar.projectKey=SPzqsgNcQkdX8oNod9x72 \
        -Dsonar.projectName="Backend Service" \
        -Dsonar.host.url=https://sonarqube.praktikum-services.ru \
        -Dsonar.login=9e4790376e5cf2ae2b80a106fd502c4599090f15 \
        -Dsonar.qualitygate.wait=true
  cache:
    paths:
      - ${CI_PROJECT_DIR}/.m2/repository

telegram-notification-backend:
  stage: notify
  rules:
    changes:
      - backend/**/*
  script:
    - |
      curl -X POST \
        -H 'Content-Type: application/json' \
        -d "{\"chat_id\": \"-1003263328596\", \"text\": \"Александров Александр Backend собран успешно\n\nАртефакты доступны по ссылке:\nhttps://gitlab.praktikum-services.ru/std-ext-028-45/Sausagestore.git/-/jobs/artifacts/$CI_COMMIT_REF_NAME/download?job=build-backend-code-job\n\n🔗 Коммит: $CI_COMMIT_SHORT_SHA\n🌿 Ветка: $CI_COMMIT_REF_NAME\"}" \
        https://api.telegram.org/bot5933756043:AAG6cdxMAdOtN3-NQ9sfS4CdpGuS8ilASwA/sendMessage
  needs:
    - build-backend-code-job

build-frontend-code-job:
  stage: build
  rules:
    changes:
      - frontend/**/*
  script:
    - cd frontend
    - npm install
    - npm run build
  artifacts:
    paths:
      - frontend/dist/frontend/
  cache:
    paths:
      - frontend/node_modules/

sonarqube-frontend-sast:
  stage: test
  image: sonarsource/sonar-scanner-cli:latest
  needs:
    - build-frontend-code-job
  rules:
    - if: '$CI_COMMIT_REF_NAME == "main" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - frontend/**/*
  script:
    - cd frontend
    - sonar-scanner \
      -Dsonar.projectKey=SPzqsgNcQkdX8oNod9x72 \
      -Dsonar.host.url=https://sonarqube.praktikum-services.ru \
      -Dsonar.login=9e4790376e5cf2ae2b80a106fd502c4599090f15 \
      -Dsonar.sources=. \
      -Dsonar.language=js

telegram-notification-frontend:
  stage: notify
  rules:
    changes:
      - frontend/**/*
  script:
    - |
      curl -X POST \
        -H 'Content-Type: application/json' \
        -d "{\"chat_id\": \"-1003263328596\", \"text\": \"Александров Александр Frontend собран успешно\n\nАртефакты доступны по ссылке:\nhttps://gitlab.praktikum-services.ru/std-ext-028-45/Sausagestore.git/-/jobs/artifacts/$CI_COMMIT_REF_NAME/download?job=build-frontend-code-job\n\n🔗 Коммит: $CI_COMMIT_SHORT_SHA\n🌿 Ветка: $CI_COMMIT_REF_NAME\"}" \
        https://api.telegram.org/bot5933756043:AAG6cdxMAdOtN3-NQ9sfS4CdpGuS8ilASwA/sendMessage
  needs:
    - build-frontend-code-job

semgrep-sast:
  stage: test
  variables:
    COMPILE: "false"
    SAST_JAVA_VERSION: 11
    MAVEN_REPO_PATH: ${CI_PROJECT_DIR}/.m2/repository
  rules:
    changes:
      - backend/**/*
      - frontend/**/*
  cache:
    paths:
      - ${CI_PROJECT_DIR}/.m2/repository