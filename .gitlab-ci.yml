stages:
  - module-pipelines
  - deploy

frontend:
  stage: module-pipelines
  trigger:
    include: "frontend/frontend.gitlab-ci.yml"
    strategy: depend
  only:
    changes:
      - frontend/**/*

backend:
  stage: module-pipelines
  trigger:
    include: "backend/backend.gitlab-ci.yml"
    strategy: depend
  only:
    changes:
      - backend/**/*

backend-report:
  stage: module-pipelines
  trigger:
    include: "backend-report/backend-report.gitlab-ci.yml"
    strategy: depend
  only:
    changes:
      - backend-report/**/*

deploy-local:
  stage: deploy
  tags:
    - shell
    - local
  script:
    - echo "=== Локальный деплой Sausage Store ==="
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    
    # Создаём сеть, если не существует
    - docker network create sausage-store 2>/dev/null || true
    
    # Останавливаем и удаляем старые контейнеры
    - docker rm -f backend backend-report frontend 2>/dev/null || true
    
    # Backend
    - echo "Запускаем backend..."
    - |
      docker run -d --name backend \
        --network sausage-store \
        -p 8080:8080 \
        -e SPRING_DATASOURCE_URL="$SPRING_DATASOURCE_URL" \
        -e SPRING_DATASOURCE_USERNAME="$SPRING_DATASOURCE_USERNAME" \
        -e SPRING_DATASOURCE_PASSWORD="$SPRING_DATASOURCE_PASSWORD" \
        -e SPRING_DATA_MONGODB_URI="$SPRING_DATA_MONGODB_URI" \
        -e LOG_PATH=/app/logs \
        -e REPORT_PATH=/app/reports \
        -v /home/ulyss/.postgresql/root.crt:/app/postgres.crt:ro \
        -v /home/ulyss/.postgresql/root.crt:/app/root.crt:ro \
        ${CI_REGISTRY_IMAGE}/sausage-store/backend:latest
    
    # Backend-report
    - echo "Запускаем backend-report..."
    - |
      docker run -d --name backend-report \
        --network sausage-store \
        -e DB="$SPRING_DATA_MONGODB_URI" \
        -e PORT=8080 \
        -v /home/ulyss/.postgresql/root.crt:/app/root.crt:ro \
        ${CI_REGISTRY_IMAGE}/sausage-store/backend-report:latest
    
    # Frontend
    - echo "Запускаем frontend..."
    - |
      docker run -d --name frontend \
        --network sausage-store \
        -p 80:80 \
        -e DEFAULT_HOST=backend \
        ${CI_REGISTRY_IMAGE}/sausage-frontend:latest
    
    # Проверка
    - echo "Ожидаем запуска backend (30 секунд)..."
    - sleep 30
    - echo "=== Проверка здоровья ==="
    - curl -s http://localhost:8080/actuator/health || echo "Backend ещё не готов"
    - echo ""
    - echo "=== Все контейнеры ==="
    - docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
  
  only:
    - main