stages:
  - build
  - test
  - notify

include:
  - template: Security/SAST.gitlab-ci.yml

build-code-job:
  stage: build
  only:
    changes:
      - backend/**/*
      - frontend/**/*
  script:
    - cd backend
    - mvn package -Dmaven.repo.local=${CI_PROJECT_DIR}/.m2/repository 
    - cd ../frontend
    - npm install
    - npm run build
    - cd ..
    - mkdir -p sausage-store-0.0.1
    - cp backend/target/sausage-store-0.0.1-SNAPSHOT.jar sausage-store-0.0.1/sausage-store-0.0.1.jar
    - cp -r frontend/dist/frontend sausage-store-0.0.1/public_html
  artifacts:
    paths:
      - sausage-store-0.0.1/

build-code-job:
  stage: build
  only:
    changes:
      - backend//*
      - frontend//*
  script:
    - cd backend
    - mvn package
  stage: build  
  only:
    changes:
      - backend//*
  script:
    - cd backend
    - mvn package
  artifacts:
    paths:
      - backend/target/sausage-store-0.0.1-SNAPSHOT.jar
      
sonarqube-backend-sast:
  stage: test
  image: maven:3.8-openjdk-16
  needs:
    - build-backend-code-job
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /send notification/
    - changes: ["backend/**/*"]
  script: |  
    cd backend && mvn verify sonar:sonar -Dsonar.qualitygate.wait=true -Dsonar.projectKey=$SONAR_PROJECT_KEY_BACK -Dsonar.host.url=$SONARQUBE_URL -Dsonar.login=$SONAR_LOGIN_BACKEND -Dsonar.projectName=$SONAR_PROJECT_NAME_BACKEND

semgrep-sast:
  stage: test
  variables:
    COMPILE: "false"
    SAST_JAVA_VERSION: 11
    MAVEN_REPO_PATH: ${CI_PROJECT_DIR}/.m2/repository
  cache:
    paths:
      - ${CI_PROJECT_DIR}/.m2/repository

telegram-notification-backend:
  stage: notify
  only:
    changes:
    - |
      curl -X POST \
        -H 'Content-Type: application/json' \
        -d "{\"chat_id\": \"-1003263328596\", \"text\": \"Backend собран. Артефакты: https://gitlab.praktikum-services.ru/std-ext-028-45/Sausagestore.git/-/jobs/artifacts/$CI_COMMIT_REF_NAME/download?job=build-backend-code-job\"}" \
        https://api.telegram.org/bot5933756043:AAG6cdxMAdOtN3-NQ9sfS4CdpGuS8ilASwA/sendMessage
  needs:
    - build-backend-code-job

build-frontend-code-job:
  stage: build  
  only:
    changes:
      - frontend/**/*
  script:        
    - cd frontend
    - npm install
    - npm run build
  artifacts:
    paths:
      - frontend/dist/frontend 

telegram-notification-frontend:
  stage: notify
  only:
    changes:
    - |
      curl -X POST \
        -H 'Content-Type: application/json' \
        -d "{\"chat_id\": \"-1003263328596\", \"text\": \"Frontend собран. Артефакты: https://gitlab.praktikum-services.ru/std-ext-028-45/Sausagestore.git/-/jobs/artifacts/$CI_COMMIT_REF_NAME/download?job=build-frontend-code-job\"}" \
        https://api.telegram.org/bot5933756043:AAG6cdxMAdOtN3-NQ9sfS4CdpGuS8ilASwA/sendMessage
  needs:
    - build-frontend-code-job