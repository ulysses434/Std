stages:
 - build
 - release

build_a:
 stage: build

build_b:
 stage: build

release_a:  
 stage: release

release_b:  
 stage: release

stages:
  
build-code-job:
  stage: build
  only:
    changes:
    - backend/**/*
    - frontend/**/*
  script:
    - cd backend
    - mvn package
    - cd ../frontend
    - npm install
    - npm run build
    - cd ..
    - mkdir sausage-store-0.0.1
    - cp backend/target/sausage-store-0.0.1-SNAPSHOT.jar sausage-store-0.0.1/sausage-store-0.0.1.jar 
    - cp -r frontend/dist/frontend sausage-store-0.0.1/public_html
  artifacts:
    paths:
      - sausage-store-0.0.1/public_html
      - sausage-store-0.0.1/sausage-store-0.0.1.jar

    script:
       cd backend && mvn package
    rules:
     - exists:
     - backend/pom.xml

    script: npm run build
    rules:
    - when: manual
      allow_failure: true

      stages:
      - build

build-backend-code-job:
  stage: build  
  only:
    changes:
    - backend/**/*
  script:
    - cd backend
    - mvn package
  artifacts:
    paths:
      - backend/target/sausage-store-0.0.1-SNAPSHOT.jar

build-frontend-code-job:
  stage: build  
  only:
    changes:
    - frontend/**/*
  script:        
    - cd frontend
    - npm install
    - npm run build
  artifacts:
    paths:
      - frontend/dist/frontend