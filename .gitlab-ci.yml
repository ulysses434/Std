stages: 
  - build
  - test
  - notify

include:
  - template: Security/SAST.gitlab-ci.yml

variables:
  SONAR_TOKEN_BACKEND: "058c12809bebb41825d79d611032f76a969c0117"
  SONAR_TOKEN_FRONTEND: "6ec52280dd469aadce23176a916261228b65d986"
  TELEGRAM_BOT_TOKEN: "5933756043:AAG6cdxMAdOtN3-NQ9sfS4CdpGuS8ilASwA"
  TELEGRAM_CHAT_ID: "-1003263328596"
  SONAR_PROJECT_KEY: "SPzqsgNcQkdX8oNod9x72"

build-code-job:
  stage: build
  only:
    - main
    - develop
    - merge_requests
  script:
    - echo "Starting full build for commit: $CI_COMMIT_SHORT_SHA"
    - echo "Building backend..."
    - cd backend && mvn clean package -DskipTests
    - echo "Backend build completed"
    - echo "Building frontend..."
    - cd ../frontend && npm ci && npm run build
    - echo "Frontend build completed"
    - echo "Preparing artifacts..."
    - echo "Starting full application build..."
    - cd backend
    - mvn package -Dmaven.repo.local=${CI_PROJECT_DIR}/.m2/repository
    - cd ../frontend
    - npm install
    - npm run build
    - cd ..
    - mkdir -p sausage-store-0.0.1
    - cp backend/target/sausage-store-0.0.1-SNAPSHOT.jar sausage-store-0.0.1/sausage-store-0.0.1.jar
    - cp -r frontend/dist/frontend sausage-store-0.0.1/public_html
    - echo "Artifacts prepared in sausage-store-0.0.1/"
  artifacts:
    paths:
      - sausage-store-0.0.1/
    expire_in: 1 week

build-backend-code-job:
  stage: build
  only:
    - main
    - develop
    - merge_requests
  script:
    - echo "Building backend only..."
    - cd backend
    - mvn clean package -DskipTests
    - echo "Backend artifact created: target/sausage-store-0.0.1-SNAPSHOT.jar"
    - echo "Starting backend build..."
    - echo $CI_COMMIT_SHORT_SHA
    - cd backend
    - mvn package -Dmaven.repo.local=${CI_PROJECT_DIR}/.m2/repository
  artifacts:
    paths:
      - backend/target/sausage-store-0.0.1-SNAPSHOT.jar
    expire_in: 1 week

build-frontend-code-job:
  stage: build
  only:
    - main
    - develop
    - merge_requests
  script:
    - echo "Building frontend only..."
    - cd frontend
    - npm ci
    - npm run build
    - echo "Frontend build completed in dist/frontend/"
  artifacts:
    paths:
      - frontend/dist/frontend/
    expire_in: 1 week
      - name:"$CI_COMMIT_REF_NAME"
      - backend/target/${CI_PROJECT_NAME}/

sonarqube-backend-sast:
  stage: test
  needs: 
    - build-backend-code-job
  only:
    - main
  image: maven:3.8-openjdk-16
  script:
    - echo "Running SonarQube analysis for backend..."
    - cd backend
    - mvn sonar:sonar -Dsonar.projectKey=$SONAR_PROJECT_KEY -Dsonar.projectName="Backend Service" -Dsonar.host.url=https://sonarqube.praktikum-services.ru -Dsonar.login=$SONAR_TOKEN_BACKEND -Dsonar.qualitygate.wait=true
    - echo "Starting SonarQube SAST analysis for backend..."
    - cd backend
    - mvn sonar:sonar -Dmaven.repo.local=${CI_PROJECT_DIR}/.m2/repository -Dsonar.projectKey=$SONAR_PROJECT_KEY -Dsonar.projectName="Backend Service" -Dsonar.host.url=https://sonarqube.praktikum-services.ru -Dsonar.login=$SONAR_TOKEN_BACKEND -Dsonar.qualitygate.wait=true

telegram-notification-backend:
  stage: notify
  only:
    changes:
      - backend/**/*
  script:
    - echo "Sending Telegram notification for backend..."
    - 'curl -X POST -H "Content-Type: application/json" -d "{\"chat_id\": \"$TELEGRAM_CHAT_ID\", \"text\": \" Backend собран\"}" https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage'
  needs: ["build-backend-code-job"]

build-frontend-code-job:
  stage: build
  only:
    changes:
      - frontend/**/*
  script:
    - echo "Starting frontend build..."
    - cd frontend
    - npm install
    - npm run build
  artifacts:
    name: "$CI_COMMIT_REF_NAME"
    paths:
      - /frontend/dist/frontend
sonarqube-frontend-sast:
  stage: test
  needs: ["build-frontend-code-job"]
  only:
    - main
  image: sonarsource/sonar-scanner-cli:latest
  image: sonarsource/sonar-scanner-cli:latest
  image: 
    - sonarsource/sonar-scanner-cli:latest
  needs:
    - build-frontend-code-job
  rules:
    changes:
      - frontend/**/*
  script:
    - echo "=== STARTING SONARQUBE-FRONTEND-SAST ==="
    - echo "Job: $CI_JOB_NAME"
    - echo "Commit: $CI_COMMIT_SHORT_SHA"
    - echo "Branch: $CI_COMMIT_REF_NAME"
    
    - echo "--- Running SonarQube analysis for frontend ---"
    - echo "Running SonarQube analysis for frontend..."
    - echo "Starting SonarQube SAST analysis for frontend..."
    - cd frontend
    - sonar-scanner -Dsonar.projectKey=$SONAR_PROJECT_KEY -Dsonar.host.url=https://sonarqube.praktikum-services.ru -Dsonar.login=$SONAR_TOKEN_FRONTEND -Dsonar.sources=. -Dsonar.language=js

telegram-notification-backend:
  stage: notify
  needs: ["build-backend-code-job"]
  only:
    - main
    - develop
  script:
    - |
      curl -s -X POST \
        -H 'Content-Type: application/json' \
        -d "{\"chat_id\": \"$TELEGRAM_CHAT_ID\", \"text\": \"Backend собран успешно. Коммит: $CI_COMMIT_SHORT_SHA, Ветка: $CI_COMMIT_REF_NAME\"}" \
        https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage || echo "Telegram notification sent"

telegram-notification-frontend:
  stage: notify
  needs: ["build-frontend-code-job"]
  only:
    - main
    - develop
  script:
    - |
      curl -s -X POST \
        -H 'Content-Type: application/json' \
        -d "{\"chat_id\": \"$TELEGRAM_CHAT_ID\", \"text\": \"Frontend собран успешно. Коммит: $CI_COMMIT_SHORT_SHA, Ветка: $CI_COMMIT_REF_NAME\"}" \
        https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage || echo "Telegram notification sent"

telegram-notification-full:
  stage: notify
  needs: ["build-code-job"]
  only:
    - main
  script:
    - |
      curl -s -X POST \
        -H 'Content-Type: application/json' \
        -d "{\"chat_id\": \"$TELEGRAM_CHAT_ID\", \"text\": \"Полная сборка успешно завершена. Коммит: $CI_COMMIT_SHORT_SHA, Ветка: $CI_COMMIT_REF_NAME\"}" \
        https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage || echo "Telegram notification sent"
    - echo "Sending Telegram notification for frontend..."
    - 'curl -X POST -H "Content-Type: application/json" -d "{\"chat_id\": \"$TELEGRAM_CHAT_ID\", \"text\": \" Frontend собран\"}" https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage'
  needs: ["build-frontend-code-job"]
