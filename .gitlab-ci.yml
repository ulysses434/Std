stages:
 - build
 - release

build_a:
 stage: build

build_b:
 stage: build

release_a:  
 stage: release

release_b:  
 stage: release

stages:
  
build-code-job:
  stage: build
  only:
    changes:
    - backend/**/*
    - frontend/**/*
  script:
    - cd backend
    - mvn package
    - cd ../frontend
    - npm install
    - npm run build
    - cd ..
    - mkdir sausage-store-0.0.1
    - cp backend/target/sausage-store-0.0.1-SNAPSHOT.jar sausage-store-0.0.1/sausage-store-0.0.1.jar 
    - cp -r frontend/dist/frontend sausage-store-0.0.1/public_html
  artifacts:
    paths:
      - sausage-store-0.0.1/public_html
      - sausage-store-0.0.1/sausage-store-0.0.1.jar

script:
  cd backend && mvn package
rules:
- exists:
      - backend/pom.xml

  script: npm run build
  rules:
  - when: manual
     allow_failure: true

stages:
- build

build-backend-code-job:
  stage: build  
  only:
changes:
    - backend/**/*
script:
    - cd backend
    - mvn package
artifacts:
    paths:
      - backend/target/sausage-store-0.0.1-SNAPSHOT.jar

build-frontend-code-job:
  stage: build  
  only:
    changes:
    - frontend/**/*
  script:        
    - cd frontend
    - npm install
    - npm run build
  artifacts:
    paths:
        g6- frontend/dist/frontend

  telegram-notification-backend:
  stage: notify
  only:
    changes:
      - backend/**/*
  script:
    - |
      curl -X POST \
        -H 'Content-Type: application/json' \
        -d "{\"chat_id\": \"-1003263328596\", \"text\": \"Backend собран. Артефакты: $CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_SHA/download?job=$CI_JOB_NAME\"}" \
        https://api.telegram.org/bot5933756043:AAG6cdxMAdOtN3-NQ9sfS4CdpGuS8ilASwA/sendMessage
  needs:
    - build-backend-code-job

telegram-notification-frontend:
  stage: notify
  only:
    changes:
    - frontend/**/*
  script:
    - |
      curl -X POST \
        -H 'Content-Type: application/json' \
        -d "{\"chat_id\": \"1003263328596\", \"text\": \"Frontend собран. Артефакты: $CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_SHA/download?job=$CI_JOB_NAME\"}" \
         https://api.telegram.org/bot5933756043:AAG6cdxMAdOtN3-NQ9sfS4CdpGuS8ilASwA/sendMessage
  needs:
    - build-frontend-code-job