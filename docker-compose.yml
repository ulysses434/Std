services:
  backend:
    image: ${CI_REGISTRY_IMAGE}/sausage-store/backend:${VERSION}
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATA_MONGODB_URI: ${REPORTS_MONGODB_URI}
      VIRTUAL_HOST: "backend"
      VIRTUAL_PORT: "8080"
    volumes:
      - /opt/certs/CA.pem:/app/postgres.crt:ro
      - /opt/certs/CA.pem:/app/root.crt:ro
    networks:
      - sausage-store
    extra_hosts:
      - "host.docker.internal:host-gateway"

  backend-report:
    build:
      context: ./backend-report
      dockerfile: Dockerfile
    image: ${CI_REGISTRY_IMAGE}/sausage-store/backend-report:${VERSION}
    container_name: sausage-store-backend-report
    environment:
      PORT: "8080"
      DB: ${REPORTS_MONGODB_URI}
    volumes:
      - /opt/certs/CA.pem:/app/root.crt:ro
    networks:
      - sausage-store

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${CI_REGISTRY_IMAGE}/sausage-frontend:${VERSION}
    container_name: sausage-store-frontend
    environment:
      DEFAULT_HOST: "backend"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
    ports:
      - "80:80"
    networks:
      - sausage-store

networks:
  sausage-store:
    driver: bridge