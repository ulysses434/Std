stages:
  - build
  - test
  - release
  - notify
  - deploy

build-frontend-code-job:
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH
      when: always
  script:
    - echo "Starting frontend build..."
    - cd frontend
    - npm install
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 week
  cache:
    paths:
      - frontend/node_modules/

sonarqube-frontend-sast:
  stage: test
  image: sonarsource/sonar-scanner-cli:latest
  needs: ["build-frontend-code-job"]
  rules:
    - if: $CI_COMMIT_BRANCH
  script:
    - cd frontend
    - sonar-scanner -Dsonar.projectKey=$SONAR_PROJECT_KEY_FRONT -Dsonar.sources=. -Dsonar.host.url=$SONARQUBE_URL -Dsonar.login=$SONAR_LOGIN_FRONT -Dsonar.projectName=$SONAR_PROJECT_NAME_FRONT

telegram-notification-frontend:
  stage: notify
  rules:
    - if: $CI_COMMIT_BRANCH
      when: on_success
  needs: ["build-frontend-code-job"]
  script:
    - |
      ARTIFACT_URL="${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_REF_NAME}/download?job=build-frontend-code-job"
      curl -X POST \
        -H 'Content-Type: application/json' \
        -d "{\"chat_id\": \"-1003263328596\", \"text\": \"Frontend собран. Job: ${CI_JOB_NAME}. Branch: ${CI_COMMIT_REF_NAME}. Artifacts: ${ARTIFACT_URL}\"}" \
        "https://api.telegram.org/bot--5933756043:AAG6cdxMAdOtN3-NQ9sfS4CdpGuS8ilASwA/sendMessage"

upload-frontend-release:
  stage: release
  rules:
    - if: $CI_COMMIT_BRANCH
      changes:
        - frontend/**/*
  needs: ["build-frontend-code-job"]
  script:
    - cd frontend
    - export VERSION=$(node -p "require('./package.json').version")
    - echo "Building archive for version $VERSION"
    - tar czvf sausage-store-${VERSION}.tar.gz dist/
    - |
      curl -v -u "${NEXUS_REPO_USER}:${NEXUS_REPO_PASS}" \
        --upload-file sausage-store-${VERSION}.tar.gz \
        "${NEXUS_REPO_URL}/repository/${NEXUS_REPO_FRONTEND_NAME}/${VERSION}/sausage-store-${VERSION}.tar.gz"

deploy:
  stage: deploy
  before_script:
    - 'command -v ssh-agent >/dev/null || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - scp ./frontend/sausage-store-frontend.service ${DEV_USER}@${DEV_HOST}:/home/${DEV_USER}/sausage-store-frontend.service
    - ssh ${DEV_USER}@${DEV_HOST} "export "CURRENT_VERSION=${VERSION}"; export "VERSION=${VERSION}"; export "DEV_HOST=${DEV_HOST}";export "NEXUS_REPO_URL=${NEXUS_REPO_URL}"; export "NEXUS_REPO_USER=${NEXUS_REPO_USER}"; export "NEXUS_REPO_PASS=${NEXUS_REPO_PASS}";setsid /bin/bash -s " < ./frontend/deploy.sh
