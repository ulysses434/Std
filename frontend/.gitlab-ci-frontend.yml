build-frontend-code-job:
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH
      when: always
  script:
    - echo "Starting frontend build..."
    - cd frontend
    - npm install
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 week

sonarqube-frontend-sast:
  stage: test
  image: sonarsource/sonar-scanner-cli:latest
  needs: ["build-frontend-code-job"]
  rules:
    - if: $CI_COMMIT_BRANCH
  script:
    - cd frontend
    - sonar-scanner -Dsonar.projectKey=$SONAR_PROJECT_KEY_FRONT -Dsonar.sources=. -Dsonar.host.url=$SONARQUBE_URL -Dsonar.login=$SONAR_LOGIN_FRONT -Dsonar.projectName="28-45_АлександровАлександр_Frontend"
    
telegram-notification-frontend:
  stage: notify
  rules:
    - if: $CI_COMMIT_BRANCH
      when: on_success
  needs: ["build-frontend-code-job"]
  script:
    - |
      ARTIFACT_URL="${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/download"
      curl -X POST \
        -H 'Content-Type: application/json' \
        -d "{\"chat_id\": \"-1003263328596\", \"text\": \"Frontend собран. Job: ${CI_JOB_NAME}. Branch: ${CI_COMMIT_REF_NAME}. Artifacts: ${ARTIFACT_URL}\"}" \
        "https://api.telegram.org/bot5933756043:AAG6cdxMAdOtN3-NQ9sfS4CdpGuS8ilASwA/sendMessage"
        