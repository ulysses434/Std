stages:
  - build
  - test
  - release
  - notify
  - deploy

include:
  - template: Security/SAST.gitlab-ci.yml

variables:
  VERSION: 0.0.${CI_PIPELINE_ID}
  MAVEN_OPTS: "-Dmaven.repo.local=${CI_PROJECT_DIR}/.m2/repository"

cache:
  paths:
    - ${CI_PROJECT_DIR}/.m2/repository

build-backend-code-job:
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH
      when: always
  script:
    - echo "Starting backend build..."
    - cd backend
    - mvn package
  artifacts:
    name: "backend-$CI_COMMIT_REF_NAME"
    paths:
      - backend/target/sausage-store-0.0.1-SNAPSHOT.jar
    expire_in: 1 week

sonarqube-backend-sast:
  stage: test
  image: maven:3.8-openjdk-16
  rules:
    - if: $CI_COMMIT_BRANCH
  needs: ["build-backend-code-job"]
  script: |
    cd backend && mvn verify sonar:sonar \
      -Dsonar.qualitygate.wait=true \
      -Dsonar.projectKey=$SONAR_PROJECT_KEY_BACK \
      -Dsonar.host.url=$SONARQUBE_URL \
      -Dsonar.login=$SONAR_LOGIN_BACK \
      -Dsonar.projectName=$SONAR_PROJECT_NAME_BACK

semgrep-sast:
  stage: test
  variables:
    COMPILE: "false"
    SAST_JAVA_VERSION: 11
    MAVEN_REPO_PATH: ${CI_PROJECT_DIR}/.m2/repository

telegram-notification-backend:
  stage: notify
  rules:
    - if: $CI_COMMIT_BRANCH
      when: on_success
  needs: ["build-backend-code-job"]
  script:
    - |
      ARTIFACT_URL="${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_REF_NAME}/download?job=build-backend-code-job"
      curl -X POST \
        -H 'Content-Type: application/json' \
        -d "{\"chat_id\": \"-1003263328596\", \"text\": \"Backend собран. Job: ${CI_JOB_NAME}. Branch: ${CI_COMMIT_REF_NAME}. Artifacts: ${ARTIFACT_URL}\"}" \
        "https://api.telegram.org/bot---5933756043:AAG6cdxMAdOtN3-NQ9sfS4CdpGuS8ilASwA/sendMessage"

upload-backend-release:
  stage: release
  rules:
    - if: $CI_COMMIT_BRANCH
      changes:
        - backend/**/*
  needs: ["build-backend-code-job"]
  script:
    - cd backend
    - mvn versions:set -DnewVersion=${VERSION}
    - >
      mvn deploy -DskipTests
      -Dmaven.repo.local=${CI_PROJECT_DIR}/.m2/repository
      -s settings.xml -Dversion.application=${VERSION}

deploy-backend:
  stage: deploy
  before_script:
    - 'command -v ssh-agent >/dev/null || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - scp ./backend/sausage-store-backend.service ${DEV_USER}@${DEV_HOST}:/home/${DEV_USER}/sausage-store-backend.service
    - ssh ${DEV_USER}@${DEV_HOST} "export \"CURRENT_VERSION=${VERSION}\"; export \"VERSION=${VERSION}\"; export \"DEV_HOST=${DEV_HOST}\"; export \"NEXUS_REPO_URL=${NEXUS_REPO_URL%/}/repository/28-45-backend\"; export \"NEXUS_REPO_USER=${NEXUS_REPO_USER}\"; export \"NEXUS_REPO_PASS=${NEXUS_REPO_PASS}\"; setsid /bin/bash -s" < ./backend/deploy.sh