stages:
  - build
  - release
  - deploy

variables:
  VERSION: 1.0.${CI_PIPELINE_ID}

build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.9.0-debug
    entrypoint: [""]
  script:
    - echo "test"
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}/backend"
      --dockerfile "${CI_PROJECT_DIR}/backend/DockerFile"
      --destination "${CI_REGISTRY_IMAGE}/sausage-backend:$CI_COMMIT_SHA"
      --build-arg VERSION=$VERSION
      --cache=true
  rules:
    - if: $CI_COMMIT_BRANCH

release:
  stage: release
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: [""]
  cache: []
  before_script:
    - crane auth login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - crane tag $CI_REGISTRY_IMAGE/sausage-backend:$CI_COMMIT_SHA $VERSION
  rules:
    - if: $CI_COMMIT_BRANCH

deploy-backend:
  stage: deploy
  image: vault:1.11.3
  before_script:
    - apk add openssh-client bash gettext
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - export VAULT_TOKEN="$(vault write -field=token auth/jwt/login role=sausage-store jwt=$CI_JOB_JWT)"
    - export DB_URL="$(vault kv get -field=spring.datasource.url secret/sausage-store)"
    - export DB_USERNAME="$(vault kv get -field=spring.datasource.username secret/sausage-store)"
    - export DB_PASSWORD="$(vault kv get -field=spring.datasource.password secret/sausage-store)"
    - export MONGO_URI="$(vault kv get -field=spring.data.mongodb.uri secret/sausage-store)"
    - >
      ssh ${DEV_USER}@${DEV_HOST}
      "export CI_REGISTRY='${CI_REGISTRY}';
       export CI_REGISTRY_USER='${CI_REGISTRY_USER}';
       export CI_REGISTRY_PASSWORD='${CI_JOB_TOKEN}';
       export VERSION='${VERSION}';
       export SPRING_DATASOURCE_URL='${DB_URL}';
       export SPRING_DATASOURCE_USERNAME='${DB_USERNAME}';
       export SPRING_DATASOURCE_PASSWORD='${DB_PASSWORD}';
       export SPRING_DATA_MONGODB_URI='${MONGO_URI}';
       bash -s" < ./backend/deploy.sh
  rules:
    - if: $CI_COMMIT_BRANCH
      exists:
        - backend/deploy.sh