stages:
  - build
  - release
  - deploy

variables:
  VERSION: 1.0.${CI_PIPELINE_ID}

build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.9.0-debug
    entrypoint: [""]
  script:
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64)\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
        --context "${CI_PROJECT_DIR}/backend"
        --dockerfile "${CI_PROJECT_DIR}/backend/Dockerfile"
        --destination "${CI_REGISTRY_IMAGE}/sausage-store/backend:${CI_COMMIT_SHA}"
        --build-arg VERSION=$VERSION
        --cache=true
  rules:
    - if: $CI_COMMIT_BRANCH == "microservices"

release:
  stage: release
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: [""]
  cache: []
  before_script:
    - crane auth login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - crane tag $CI_REGISTRY_IMAGE/sausage-store/backend:$CI_COMMIT_SHA $VERSION
  rules:
    - if: $CI_COMMIT_BRANCH == "microservices"

deploy-backend:
  stage: deploy
  image: docker:24.0.5
  before_script:
    - apk add --no-cache openssh-client bash curl unzip
    - curl -fsSL https://releases.hashicorp.com/vault/1.11.3/vault_1.11.3_linux_amd64.zip -o /tmp/vault.zip
    - unzip -o /tmp/vault.zip -d /usr/local/bin/
    - chmod +x /usr/local/bin/vault
    - rm /tmp/vault.zip
    - eval $(ssh-agent -s)
    - echo "${SSH_PRIVATE_KEY}" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "${SSH_KNOWN_HOSTS}" >> ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
    - docker context create remote --docker "host=ssh://${DEV_USER}@${DEV_HOST}"
    - docker context use remote
    - echo "${CI_REGISTRY_PASSWORD}" | docker login -u "${CI_REGISTRY_USER}" --password-stdin ${CI_REGISTRY}
  script:
    - export VAULT_TOKEN="$(vault write -field=token auth/jwt/login role=sausage-store jwt=$CI_JOB_JWT)"
    - export SPRING_DATASOURCE_URL="$(vault kv get -field=spring.datasource.url secret/sausage-store)"
    - export SPRING_DATASOURCE_USERNAME="$(vault kv get -field=spring.datasource.username secret/sausage-store)"
    - export SPRING_DATASOURCE_PASSWORD="$(vault kv get -field=spring.datasource.password secret/sausage-store)"
    - export REPORTS_MONGODB_URI="$(vault kv get -field=spring.data.mongodb.uri secret/sausage-store)"
    - export VERSION=${VERSION}
    - docker compose up -d --force-recreate backend
  rules:
    - if: $CI_COMMIT_BRANCH == "microservices"